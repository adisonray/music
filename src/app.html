<!doctype html>
<html lang="en" class="dark" data-sveltekit-preload-data="false">
	<head>
		<meta charset="utf-8">

		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
		%adi.theme-color-meta%

		<title>Adi Music</title>

		<meta name="description" content="%adi.description%">

		<link rel="icon" href="/icons/raster-16.png" sizes="16x16" type="image/png">
		<link rel="icon" href="/icons/raster-32.png" sizes="32x32" type="image/png">
		<link rel="icon" href="/icons/raster-48.png" sizes="48x48" type="image/png">
		<link rel="icon" href="/icons/raster-128.png" sizes="128x128" type="image/png">
		<link rel="icon" href="/icons/raster-192.png" sizes="192x192" type="image/png">

		<link rel="icon" href="/icons/responsive.svg" type="image/svg+xml">

		<link
			rel="preload"
			href="/fonts/MPLUSRounded1c-Regular.ttf"
			as="font"
			type="font/ttf"
			crossorigin="anonymous"
		>

		<!-- AeroUI Design System: live CDN branch -->
		<link
			rel="stylesheet"
			href="https://nurislamaibekuly.github.io/aeroui/src/aeroui.css"
		crossorigin="anonymous"
		>
		<script type="module" src="https://nurislamaibekuly.github.io/aeroui/src/components/spinner/spinner.js" crossorigin="anonymous"></script>
		<script type="module" src="https://nurislamaibekuly.github.io/aeroui/src/components/button/button.js" crossorigin="anonymous"></script>
		<script type="module" src="https://nurislamaibekuly.github.io/aeroui/src/components/slider/slider.js" crossorigin="anonymous"></script>
		<script type="module" src="https://nurislamaibekuly.github.io/aeroui/src/components/toggle/toggle.js" crossorigin="anonymous"></script>
		<script type="module" src="https://nurislamaibekuly.github.io/aeroui/src/components/tooltip/tooltip.js" crossorigin="anonymous"></script>
		<script type="module" src="https://nurislamaibekuly.github.io/aeroui/src/components/segmented/segmented.js" crossorigin="anonymous"></script>
		<script type="module" src="https://nurislamaibekuly.github.io/aeroui/src/components/dropdown/dropdown.js" crossorigin="anonymous"></script>
		<script type="module" src="https://nurislamaibekuly.github.io/aeroui/src/components/modal/modal.js" crossorigin="anonymous"></script>
		<script type="module" src="https://nurislamaibekuly.github.io/aeroui/src/components/accordion/accordion.js" crossorigin="anonymous"></script>
		<script type="module" src="https://nurislamaibekuly.github.io/aeroui/src/components/progress/progress.js" crossorigin="anonymous"></script>
		<script type="module" src="https://nurislamaibekuly.github.io/aeroui/src/components/elastic-slider/elastic-slider.js" crossorigin="anonymous"></script>
		<script type="module" src="https://nurislamaibekuly.github.io/aeroui/src/components/player-button/player-button.js" crossorigin="anonymous"></script>
		<script type="module" src="https://nurislamaibekuly.github.io/aeroui/src/components/skip-label/skip-label.js" crossorigin="anonymous"></script>

		%sveltekit.head%

		<link rel="manifest" href="/manifest.webmanifest">
	</head>

	<body>
		<noscript>Please enable Javascript in order to use this app.</noscript>
		<div id="unsupported-browser" hidden class="m-auto rounded-2xl bg-[dimgray] p-5 text-[white]">
			<div>
				This browser does not support required technologies for this app to function correctly.
			</div>
			<div>Please upgrade your browser to the latest version of:</div>
			<a class="link text-primary" href="https://www.mozilla.org/en-US/firefox/new/">Firefox</a>
			<a class="link text-primary" href="https://www.microsoft.com/en-us/windows/microsoft-edge">
				Edge
			</a>
			<a class="link text-primary" href="https://www.google.com/chrome/">Chrome</a>
		</div>
		%adi.svg-icons-paths%

		<div id="app">%sveltekit.body%</div>

		<script
			src="https://gc.zgo.at/count.js"
			data-goatcounter="%adi.goat-counter-url%/count"
			crossorigin="anonymous"
			async
			data-goatcounter-settings='{"no_onload": true}'
		></script>

		<script defer src="/supported-browser-check.js"></script>
	</body>
</html>
